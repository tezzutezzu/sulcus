name: Deploy live visualiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Only the self-contained live app is published.
      - name: Upload live/
        uses: actions/upload-pages-artifact@v3
        with:
          path: live

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
