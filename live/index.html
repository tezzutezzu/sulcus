<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sulcus — live visualiser for an audio input: a ring whose ridges follow the sound in real time.">
<meta name="theme-color" content="#111315">
<title>Sulcus — Live</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="app.js"></script>
</head>
<body>
<main class="live">
  <div id="viewer" class="live-viewer" role="img" aria-keyshortcuts="T R A C" aria-label="Live input relief: a ring whose ridges rise with the sound picked up from the selected source"></div>
  <section class="live-filter" aria-label="Frequency band"
           title="Drag the edges to zoom the ring into a band. Double-click to reset.">
    <div id="filter-plot" class="live-filter-plot">
      <canvas id="filter-canvas"></canvas>
      <div id="filter-low" class="filter-handle" role="slider" tabindex="0"
           aria-label="Band start" aria-valuemin="50" aria-valuemax="20000"
           aria-valuenow="50" aria-valuetext="50 Hz"></div>
      <div id="filter-high" class="filter-handle" role="slider" tabindex="0"
           aria-label="Band end" aria-valuemin="50" aria-valuemax="20000"
           aria-valuenow="20000" aria-valuetext="20 kHz"></div>
    </div>
    <p class="live-filter-readout">
      <span id="filter-low-label">50 Hz</span>
      <span id="filter-high-label">20 kHz</span>
    </p>
  </section>
  <div class="live-controls">
    <select id="live-source" class="live-select" aria-label="Audio source">
      <option value="default">Default microphone</option>
    </select>
    <button id="live-toggle" class="play" type="button" aria-pressed="false">Start</button>
    <div class="live-length" role="group" aria-label="History length">
      <button id="live-length-less" class="length-step" type="button" aria-label="Shorter history">−</button>
      <span class="length-field">
        <input id="live-length" type="number" min="1" max="600" step="1"
               inputmode="numeric" value="15" aria-label="History length in seconds">
        <span class="length-unit" aria-hidden="true">s</span>
      </span>
      <button id="live-length-more" class="length-step" type="button" aria-label="Longer history">+</button>
    </div>
  </div>
  <p id="live-status" class="sr-only" role="status" aria-live="polite">Press Start to visualise the input. T top view, R reset, A auto-orbit, C log the camera.</p>
</main>
</body>
</html>
